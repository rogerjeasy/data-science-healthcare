[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-risk"
version = "0.1.0"
description = "Can routine health data identify suicidal ideation that a depression screen misses? (HSLU, Data Science in Health Care)"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
